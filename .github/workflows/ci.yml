name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 回归自测：18 条单元 + 8 条文档级
      # 不需要 pandoc/typst —— selftest 是纯 Python 计算
      - name: Run selftest
        run: python skills/formula-typesetting/scripts/formula_norm.py selftest

      # 跨平台卫生检查：中文只能出现在注释和字符串里
      # 独立 .py 文件 ⇒ Windows runner（默认 shell 是 PowerShell）也能跑
      - name: Check scripts are portable
        run: python tests/check_portable.py
